<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mağazam</title>
                <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                                body { 
                                            font-family: Arial, sans-serif; 
                                                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                                                                    min-height: 100vh;
                                                                            }
                                                                                    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
                                                                                            header { 
                                                                                                        background: rgba(255,255,255,0.95); 
                                                                                                                    padding: 20px; 
                                                                                                                                border-radius: 15px; 
                                                                                                                                            margin-bottom: 20px;
                                                                                                                                                        text-align: center;
                                                                                                                                                                }
                                                                                                                                                                        h1 { color: #333; font-size: 2.5rem; }
                                                                                                                                                                                .products { 
                                                                                                                                                                                            display: grid; 
                                                                                                                                                                                                        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
                                                                                                                                                                                                                    gap: 20px; 
                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                    .product { 
                                                                                                                                                                                                                                                background: white; 
                                                                                                                                                                                                                                                            border-radius: 15px; 
                                                                                                                                                                                                                                                                        overflow: hidden; 
                                                                                                                                                                                                                                                                                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                                                                                                                                                                                                                                                                                                transition: transform 0.3s;
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                .product:hover { transform: translateY(-10px); }
                                                                                                                                                                                                                                                                                                                        .product img { width: 100%; height: 200px; object-fit: cover; }
                                                                                                                                                                                                                                                                                                                                .product-info { padding: 20px; }
                                                                                                                                                                                                                                                                                                                                        .product h3 { margin-bottom: 10px; color: #333; }
                                                                                                                                                                                                                                                                                                                                                .price { 
                                                                                                                                                                                                                                                                                                                                                            font-size: 1.5rem; 
                                                                                                                                                                                                                                                                                                                                                                        color: #e74c3c; 
                                                                                                                                                                                                                                                                                                                                                                                    font-weight: bold; 
                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                    .old-price { 
                                                                                                                                                                                                                                                                                                                                                                                                                text-decoration: line-through; 
                                                                                                                                                                                                                                                                                                                                                                                                                            color: #999; 
                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-right: 10px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                        .btn { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    background: #667eea; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                color: white; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border: none; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 12px 30px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 25px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cursor: pointer; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 1rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .btn:hover { background: #764ba2; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .badge { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        position: absolute; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    background: #e74c3c;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 5px 15px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 20px;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                margin: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .discount { background: #27ae60; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>
